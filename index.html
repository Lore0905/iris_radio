<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADIO IRIS — Alza la musica, abbassa i pensieri</title>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: #0a0a0f;
      color: #f0f0f0;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .hero-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.8s ease-in-out;
      z-index: 0;
    }
    .hero-slide.active {
      opacity: 1;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(6,6,10,0.55) 0%, rgba(6,6,10,0.75) 40%, rgba(6,6,10,0.92) 75%, rgba(6,6,10,0.98) 100%);
      z-index: 1;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      padding: 0 24px;
      max-width: 700px;
    }
    .hero-logo {
      width: 64px; height: 64px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .hero-logo svg { width: 32px; height: 32px; color: #fff; }
    .hero h1 {
      font-size: clamp(36px, 8vw, 72px);
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1.05;
      text-shadow: 0 4px 30px rgba(0,0,0,0.6);
      margin-bottom: 12px;
    }
    .hero p {
      font-size: clamp(16px, 3vw, 22px);
      color: rgba(255,255,255,0.7);
      font-weight: 400;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
      margin-bottom: 28px;
    }
    .hero .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 30px;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.25);
      font-size: 14px;
      font-weight: 600;
      color: #4ade80;
      letter-spacing: 0.8px;
      backdrop-filter: blur(8px);
    }
    .hero .live-pill .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 10px #4ade80;
    }
    .hero .live-pill.playing .dot {
      animation: pulse-dot 1.8s infinite ease-in-out;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }
    .scroll-hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.45);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: bounce 2.5s infinite;
    }
    .scroll-hint svg { width: 20px; height: 20px; }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
      40% { transform: translateX(-50%) translateY(-10px); }
      60% { transform: translateX(-50%) translateY(-5px); }
    }

    /* ===== GALLERY ===== */
    .gallery-section {
      position: relative;
      z-index: 1;
      padding: 80px 20px 140px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .gallery-section h2 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
    }
    .gallery-section .subtitle {
      text-align: center;
      color: rgba(255,255,255,0.45);
      font-size: 15px;
      margin-bottom: 36px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .gallery-item {
      aspect-ratio: 4 / 3;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      background: #1a1a24;
      border: 1px solid rgba(255,255,255,0.06);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .gallery-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .gallery-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }
    .gallery-item:hover img {
      transform: scale(1.06);
    }

    /* ===== CTA ===== */
    .cta-section {
      padding: 0 20px 120px;
      max-width: 720px;
      margin: 0 auto;
    }
    .cta-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      transition: all 0.25s ease;
      backdrop-filter: blur(8px);
    }
    .cta-card:hover {
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.12);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    .cta-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .cta-icon svg { width: 24px; height: 24px; color: rgba(255,255,255,0.65); }
    .cta-text { flex: 1; }
    .cta-text .title { font-size: 16px; font-weight: 600; margin-bottom: 3px; }
    .cta-text .desc { font-size: 14px; color: rgba(255,255,255,0.4); }
    .cta-arrow {
      width: 20px; height: 20px;
      color: rgba(255,255,255,0.3);
      flex-shrink: 0;
      transition: transform 0.2s ease, color 0.2s ease;
    }
    .cta-card:hover .cta-arrow {
      transform: translateX(3px);
      color: rgba(255,255,255,0.7);
    }

    /* ===== PLAYER BAR (STICKY) ===== */
    .player-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: calc(100% - 40px);
      max-width: 620px;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(28px) saturate(1.5);
      -webkit-backdrop-filter: blur(28px) saturate(1.5);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03) inset;
      transition: box-shadow 0.3s ease;
    }
    .player-bar:hover {
      box-shadow: 0 14px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.05) inset;
    }
    .player-btn {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: none;
      background: #fff;
      color: #0a0a0f;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
    .player-btn:hover { transform: scale(1.06); }
    .player-btn:active { transform: scale(0.95); }
    .player-btn svg { width: 22px; height: 22px; }

    .player-meta {
      flex: 1;
      min-width: 0;
    }
    .player-meta .title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-meta .status {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      min-height: 20px;
      transition: color 0.2s ease;
    }
    .player-meta .status.error {
      color: #f87171;
    }

    .player-vol {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .player-vol svg { width: 20px; height: 20px; color: rgba(255,255,255,0.45); }
    .player-vol input[type="range"] {
      width: 90px;
      accent-color: #fff;
      cursor: pointer;
    }

    /* ===== FOOTER ===== */
    .footer {
      text-align: center;
      padding: 0 20px 120px;
      font-size: 12px;
      color: rgba(255,255,255,0.22);
      letter-spacing: 0.5px;
    }

    @media (max-width: 560px) {
      .player-bar { padding: 12px 16px; gap: 12px; }
      .player-btn { width: 46px; height: 46px; }
      .player-btn svg { width: 18px; height: 18px; }
      .player-vol input[type="range"] { width: 70px; }
      .gallery-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .gallery-section { padding: 60px 16px 140px; }
    }
  </style>
<base target="_blank">
</head>

  <audio id="radio-audio" preload="none" crossorigin="anonymous"></audio>

  <script>
    (function() {
      /* ===== SLIDESHOW HERO ===== */
      var slides = document.querySelectorAll('.hero-slide');
      var currentSlide = 0;
      setInterval(function() {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
      }, 5000);

      /* ===== PLAYER ===== */
      var audio = document.getElementById('radio-audio');
      var btn = document.getElementById('play-btn');
      var iconPlay = document.getElementById('icon-play');
      var iconStop = document.getElementById('icon-stop');
      var status = document.getElementById('player-status');
      var vol = document.getElementById('volume');
      var pill = document.getElementById('live-pill');
      var playing = false;
      var isStopping = false;

      audio.volume = 0.8;

      audio.addEventListener('error', function() {
        if (isStopping) return;
        var err = audio.error;
        var msg = 'Stream non disponibile';
        if (err) {
          switch (err.code) {
            case 1: msg = 'Download interrotto'; break;
            case 2: msg = 'Errore di rete'; break;
            case 3: msg = 'Formato non supportato'; break;
            case 4: msg = 'Stream non raggiungibile'; break;
          }
        }
        status.textContent = msg;
        status.classList.add('error');
        playing = false;
        iconPlay.style.display = '';
        iconStop.style.display = 'none';
        pill.classList.remove('playing');
      });

      btn.addEventListener('click', function() {
        if (playing) {
          isStopping = true;
          audio.pause();
          audio.removeAttribute('src');
          audio.load();
          playing = false;
          iconPlay.style.display = '';
          iconStop.style.display = 'none';
          status.textContent = 'Clicca play per ascoltare';
          status.classList.remove('error');
          pill.classList.remove('playing');
          setTimeout(function() { isStopping = false; }, 200);
        } else {
          status.textContent = 'Connessione in corso...';
          status.classList.remove('error');
          audio.src = 'https://nr12.newradio.it:8664/stream';
          audio.play().then(function() {
            playing = true;
            iconPlay.style.display = 'none';
            iconStop.style.display = '';
            status.textContent = 'Streaming in corso...';
            pill.classList.add('playing');
          }).catch(function() {
            status.textContent = 'Apertura pannello...';
            window.location.href = 'https://nr12.newradio.it/public/8664';
          });
        }
      });

      vol.addEventListener('input', function() {
        audio.volume = vol.value;
      });
    })();
  </script>
